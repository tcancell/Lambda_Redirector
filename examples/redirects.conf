# Deployment-safe starter config. Replace example hosts with your real domains.

<VirtualHost tcancell.test.gwu.edu>
  Redirect 301 /* https://it.gwu.edu [QSD]
</VirtualHost>

<VirtualHost lamred.test.gwu.edu>
  ServerAlias www.lamred.test.gwu.edu

  RewriteCond %{HTTP_HOST} ^(www\.)?lamred\.test\.gwu\.edu$ [NC]
  RewriteRule ^/(.*)$ https://virginia.gwu.edu/$1 [R=301,L,QSD]
</VirtualHost>

<VirtualHost redirector.test.gwu.edu>
  Redirect 301 /* https://ccas.gwu.edu [QSD]
</VirtualHost>
