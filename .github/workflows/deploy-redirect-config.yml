name: Deploy redirect config

on:
  push:
    branches:
      - main
    paths:
      - "examples/**/*.conf"
      - "src/parser.py"
      - "src/compiler.py"
      - "tools/validate_redirect_config.py"
      - ".github/workflows/deploy-redirect-config.yml"
  workflow_dispatch:
    inputs:
      config_path:
        description: "Redirect config path to validate and upload"
        required: false
        default: "examples/redirects.conf"
      s3_key:
        description: "S3 object key for the redirect config"
        required: false
        default: "redirects.conf"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CONFIG_PATH: ${{ inputs.config_path || vars.REDIRECT_CONFIG_PATH || 'examples/redirects.conf' }}
  S3_BUCKET: ${{ vars.REDIRECT_CONFIG_BUCKET }}
  S3_KEY: ${{ inputs.s3_key || vars.REDIRECT_CONFIG_KEY || 'redirects.conf' }}

jobs:
  validate-and-upload:
    name: Validate and upload redirect config
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Apache redirect config
        run: |
          python tools/validate_redirect_config.py "$CONFIG_PATH" --github-annotations --summary-json

      - name: Validate deployment settings
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::Set repository variable REDIRECT_CONFIG_BUCKET to the S3 config bucket name."
            exit 1
          fi
          if [ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "::error::Set repository secret AWS_ROLE_TO_ASSUME to the GitHub OIDC deploy role ARN."
            exit 1
          fi
          test -f "$CONFIG_PATH"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload redirect config to S3
        run: |
          aws s3 cp "$CONFIG_PATH" "s3://$S3_BUCKET/$S3_KEY"             --content-type "text/plain; charset=utf-8"             --cache-control "no-store"
          echo "Uploaded $CONFIG_PATH to s3://$S3_BUCKET/$S3_KEY"
